<!doctype html><html><body>
<script type="importmap">{"imports":{"three":"./three.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './gltf/GLTFLoader.js';
import { MeshoptDecoder } from './gltf/meshopt.js';
const load = (u) => new Promise((ok, err) => new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(u, ok, null, err));
const r4 = (v) => Math.round(v * 1e4) / 1e4;
const out = {};
for (const g of ['M', 'F']) {
  const gl = await load(`./miiBody${g}_wiiu.glb`), root = gl.scene;
  root.updateMatrixWorld(true);
  const nodes = [], idx = new Map();
  root.traverse((o) => { idx.set(o, nodes.length); nodes.push(o); });
  const meshes = [];
  const N = nodes.map((o) => ({ name: o.name, parent: o.parent && idx.has(o.parent) ? idx.get(o.parent) : -1, kind: o.isBone ? 'bone' : o.isSkinnedMesh ? 'mesh' : 'group',
    t: o.position.toArray().map(r4), q: o.quaternion.toArray().map(r4), s: o.scale.toArray().map(r4) }));
  for (const o of nodes) if (o.isSkinnedMesh) {
    const G = o.geometry, A = (n, k = 4) => { const a = G.attributes[n]; const o2 = []; for (let i = 0; i < a.count; i++) for (let c = 0; c < a.itemSize; c++) o2.push(Math.round(a.getComponent(i, c) * 10 ** k) / 10 ** k); return o2; };
    const col = A('color', 3);
    meshes.push({ node: idx.get(o), pos: A('position'), nrm: A('normal', 3), ji: A('skinIndex', 0), jw: A('skinWeight', 3), idx: Array.from(G.index.array),
      colMinMax: [Math.min(...col), Math.max(...col)], bones: o.skeleton.bones.map((b) => idx.get(b)), inv: o.skeleton.boneInverses.map((m) => m.toArray().map((v) => Math.round(v * 1e5) / 1e5)), bind: o.bindMatrix.toArray().map(r4) });
  }
  // the Wait pose: each bone's turn in the first frame of the creator's idle animation
  const mixer = new THREE.AnimationMixer(root), clip = gl.animations.find((a) => a.name === 'Wait');
  mixer.clipAction(clip).play(); mixer.update(0);
  const wait = {}; for (const o of nodes) if (o.isBone) wait[o.name] = o.quaternion.toArray().map(r4).concat(o.position.toArray().map(r4));
  // which way the toes point: the lowest vertices, in the model
  out[g] = { nodes: N, meshes, wait, clips: gl.animations.map((a) => a.name) };
}
window.__out = out; window.__done = true;
</script></body></html>
